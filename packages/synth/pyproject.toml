[project]
name = "assurekit-synth"
version = "0.1.0.dev0"
description = "Seeded synthetic financial test data for FinTech and credit-union QA"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Malikan Inc." }]
keywords = ["testing", "synthetic-data", "fintech", "credit-union", "qa"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/malikan-inc/assurekit"
Changelog = "https://github.com/malikan-inc/assurekit/blob/main/CHANGELOG.md"

# Uncomment when cli.py exists (issue S-10):
# [project.scripts]
# assurekit-synth = "assurekit_synth.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
